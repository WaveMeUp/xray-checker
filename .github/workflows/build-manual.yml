name: Build image (manual)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker tag for the image (e.g. 26.3.27 or latest)"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve git commit
        id: meta
        run: echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_TAG=${{ inputs.image_tag }}
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
            USERNAME=${{ github.repository_owner }}
            REPOSITORY_NAME=${{ github.event.repository.name }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ inputs.image_tag }}
